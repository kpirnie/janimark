# =============================================================================
# KP Security Rules - Block Access to Sensitive Files
# =============================================================================

# -----------------------------------------------------------------------------
# Security Headers
# -----------------------------------------------------------------------------
add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload"; # enable, cache, and preload subdomains
add_header X-Frame-Options "SAMEORIGIN" always; # generally only allow SAMEORIGIN frame sources
add_header X-Content-Type-Options "nosniff" always; # no sniffing allowed!
add_header Referrer-Policy "strict-origin"; # protect agains cross-linking
add_header X-Download-Options "noopen"; # force the download, and do not allow direct openning
add_header X-Permitted-Cross-Domain-Policies "none"; # protect agains cross-linking
add_header X-Robots-Tag none; # only allow robots.txt# Content Security Policy
add_header Cross-Origin-Embedder-Policy "unsafe-none";
add_header Cross-Origin-Opener-Policy "same-origin";
add_header Cross-Origin-Resource-Policy "same-site";
add_header Access-Control-Allow-Methods "GET, HEAD, POST";
add_header Access-Control-Allow-Origin "*";
set $CSP_image "img-src 'self';"; # allowable external image domains
set $CSP_script "script-src 'self';"; # allowable external jaavscript domains
set $CSP_style "style-src 'self';"; # allowable external CSS domains
set $CSP_font "font-src 'self';"; # allowable external font domains
set $CSP_frame "frame-src 'self';"; # allowable external frames/iframes domains
set $CSP_object "object-src 'self';"; # allowable external object domains
set $CSP_connect "connect-src 'self';"; # allowable external connect domains
set $CSP_media "media-src 'self';"; # allowable external media domains
set $CSP_form "form-action 'self';"; # allowable external form domains
set $CSP_frame_anc "frame-ancestors 'self';"; # allowable external frame ancestor domains
set $CSP_default "default-src 'self';"; # allowable default sources
set $CSP_child "child-src 'self';";
set $CSP_manifest "manifest-src 'self';";
set $CSP_script_src_elem "script-src-elem 'self';";
set $CSP_script_src_attr "script-src-attr 'self';";
set $CSP_style_src_elem "style-src-elem 'self';";
set $CSP_style_src_attr "style-src-attr 'self';";
set $CSP_worker "worker-src 'self';";
set $CSP "${CSP_default} ${CSP_image} ${CSP_script} ${CSP_style} ${CSP_font} ${CSP_frame} ${CSP_object} ${CSP_connect} ${CSP_media} ${CSP_form} ${CSP_frame_anc} ${CSP_child} ${CSP_manifest} ${CSP_script_src_elem} ${CSP_script_src_attr} ${CSP_style_src_elem} ${CSP_style_src_attr} ${CSP_worker} upgrade-insecure-requests;";
add_header Content-Security-Policy $CSP always;
add_header Permissions-Policy "interest-cohort=(self), accelerometer=(self), ambient-light-sensor=(self), autoplay=(self), camera=(self), display-capture=(self), document-domain=(self), encrypted-media=(self), execution-while-not-rendered=(self), execution-while-out-of-viewport=(self), fullscreen=(self), gamepad=(self), geolocation=(self), gyroscope=(self), magnetometer=(self), microphone=(self), midi=(self), navigation-override=(self), payment=(self), picture-in-picture=(self), publickey-credentials-get=(self), sync-xhr=(self), usb=(self), xr-spatial-tracking=(self)";
add_header Developer "Kevin Pirnie";
add_header Developer-Role "DevOps Support Lead, WordPress/Hosting";
add_header Developer-Website "https://kevinpirnie.com/";
add_header Hosted-On "PodNest (https://podnest.app/)";

# -----------------------------------------------------------------------------
# Block Builder
# -----------------------------------------------------------------------------
location ^~ /build/ {
    deny all;
    return 403;
}
location ^~ /vendor/ {
    deny all;
    return 403;
}
location ~ ^/(build\.sh|config\.php|config\.sample\.php)$ {
    deny all;
    return 403;
}

# -----------------------------------------------------------------------------
# Block Composer & NPM Files
# -----------------------------------------------------------------------------
location ~ ^/(composer\.json|composer\.lock|package\.json|gulpfile\.js)$ {
    deny all;
    return 403;
}

# -----------------------------------------------------------------------------
# Block Documentation and Config Files
# -----------------------------------------------------------------------------
location ~* ^/(readme\.md|README\.md|CHANGELOG\.md|LICENSE|CONTRIBUTING\.md|\.gitignore|\.gitattributes|\.editorconfig)$ {
    deny all;
    return 403;
}
location ~ ^/assets/config\.json$ {
    deny all;
    return 403;
}
location ~ ^/config\.json$ {
    deny all;
    return 403;
}

# -----------------------------------------------------------------------------
# Block Backup, Schemas and Log Files
# -----------------------------------------------------------------------------
location ~* \.(sql|sql\.gz|bak|backup|old|orig|log|logs)$ {
    deny all;
    return 403;
}

# -----------------------------------------------------------------------------
# Block Source Control Directories
# -----------------------------------------------------------------------------
location ^~ /.git/ {
    deny all;
    return 403;
}

# -----------------------------------------------------------------------------
# Block YAML and INI Config Files
# -----------------------------------------------------------------------------
location ~* \.(yaml|yml|ini|conf)$ {
    # Allow nginx conf files to be readable for reference if needed
    # Remove this condition if you want to block all conf files
    location ~* nginx.*\.conf$ {
        deny all;
        return 403;
    }
    deny all;
    return 403;
}

# -----------------------------------------------------------------------------
# Guard the Contact Form Handler
# -----------------------------------------------------------------------------
set $sendit_method "";
if ($uri = /sendit.php) {
    set $sendit_method "1";
}
if ($request_method != POST) {
    set $sendit_method "${sendit_method}1";
}
if ($sendit_method = "11") {
    return 405;
}

set $sendit_origin "";
if ($uri = /sendit.php) {
    set $sendit_origin "1";
}
if ($http_origin != "https://$host") {
    set $sendit_origin "${sendit_origin}1";
}
if ($sendit_origin = "11") {
    return 403;
}

# =============================================================================
# KP Static Caching Rules
# =============================================================================

# -----------------------------------------------------------------------------
# Cache Images, CSS and JS
# -----------------------------------------------------------------------------
location ~* \.(avif|webp|png|jpe?g|gif|svg|ico|css|js)$ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
    access_log off;
    log_not_found off;
}

# -----------------------------------------------------------------------------
# HTML
# -----------------------------------------------------------------------------
location ~* \.(html|html)$ {
    expires max;
    access_log off;
}
